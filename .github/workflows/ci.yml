name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest-cov

      - name: Lint with Ruff
        run: ruff check backend/ ml/

      - name: Download Model Weights
        run: python ml/src/weights_manager.py

      - name: Run Pytest with Coverage
        run: pytest -v --cov=backend.app --cov-report=xml

  frontend-checks:
    name: Frontend Lint, Type-Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type-Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit Tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Validate Multi-Stage Docker Builds
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: false
          tags: attendance-backend:test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: false
          tags: attendance-frontend:test
