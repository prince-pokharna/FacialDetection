services:
  db:
    image: pgvector/pgvector:pg16
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: attendance_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Face Recognition Attendance System"
      ENVIRONMENT: "production"
      DEBUG: "false"
      PORT: 8000
      SECRET_KEY: "change-this-secret-key-in-production-min-32-chars-long"
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/attendance_db"
      CORS_ORIGINS: "*"
      FAR_THRESHOLD: "0.42"
      LIVENESS_THRESHOLD: "0.50"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: attendance_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
